---
- name: Setup Telemetry Stack on AWS
  hosts: telemetry_server
  become: yes

  tasks:
    # Fix dpkg and forcefully purge any conflicting Docker remnants.
    - name: Force cleanup of broken dpkg and purge Docker remnants
      shell: |
        dpkg --configure -a || true
        apt-get --fix-broken install -y || true
        rm -f /etc/apt/sources.list.d/*docker*.list || true
        apt-get purge -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin docker-ce-rootless-extras docker.io docker-compose docker-compose-v2 containerd runc || true
        apt-get autoremove -y || true
      ignore_errors: yes

    # Now that the system is completely clean, install the OS-provided packages
    - name: Update apt cache and install Docker, Git, and Fail2Ban
      apt:
        name:
          - docker.io
          - docker-compose-v2
          - git
          - fail2ban
        state: present
        update_cache: yes

    # Secure SSH access by whitelisting developer IPs in Fail2Ban
    - name: Whitelist my IPs in Fail2Ban
      copy:
        dest: /etc/fail2ban/jail.local
        content: |
          [DEFAULT]
          ignoreip = 127.0.0.1/8 ::1 {{ dev_ips | replace(',', ' ') }}
      notify: Restart Fail2Ban

    # Clone the application source code from GitLab
    - name: Clone the repository from GitLab
      git:
        repo: 'https://gitlab.com/lakicsdomi-portfolio/telemetry-api.git'
        dest: /home/ubuntu/app
        version: main
        force: yes
      become: false

    # Generate the .env file with the SMTP password and dynamic IPs
    - name: Create .env file with secrets
      copy:
        dest: /home/ubuntu/app/.env
        content: |
          SMTP_PASSWORD={{ smtp_pass }}
          AllowedIps={{ dev_ips | replace(' ', ',') }}
      become: false

    # Run Docker Compose to build and start the application
    - name: Start the Docker Compose stack
      shell: "docker compose up -d"
      args:
        chdir: /home/ubuntu/app

  # Handlers are only executed if notified by a task that changed the system state
  handlers:
    - name: Restart Fail2Ban
      service:
        name: fail2ban
        state: restarted
      # Avoid dry-run errors by only restarting if we're not in check mode
      when: not ansible_check_mode