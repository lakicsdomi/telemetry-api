---
- name: Setup Telemetry Stack on AWS
  hosts: telemetry_server
  become: yes

  tasks:
    # Fix dpkg and forcefully purge any conflicting Docker remnants.
    - name: Force cleanup of broken dpkg and purge Docker remnants
      shell: |
        dpkg --configure -a || true
        apt-get --fix-broken install -y || true
        rm -f /etc/apt/sources.list.d/*docker*.list || true
        apt-get purge -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin docker-ce-rootless-extras docker.io docker-compose docker-compose-v2 containerd runc || true
        apt-get autoremove -y || true
      ignore_errors: yes

    # Now that the system is completely clean, install the OS-provided packages
    - name: Update apt cache and install Docker, Git, and Fail2Ban
      apt:
        name:
          - docker.io
          - docker-compose-v2
          - git
          - fail2ban
        state: present
        update_cache: yes

    - name: Ensure 2GB Swap file exists
      shell: |
        if [ ! -f /swapfile ]; then
          fallocate -l 2G /swapfile
          chmod 600 /swapfile
          mkswap /swapfile
          swapon /swapfile
          echo '/swapfile none swap sw 0 0' >> /etc/fstab
        fi
      args:
        creates: /swapfile

    # Secure SSH access by whitelisting developer IPs in Fail2Ban
    - name: Whitelist my IPs in Fail2Ban
      copy:
        dest: /etc/fail2ban/jail.local
        content: |
          [DEFAULT]
          # Whitelist current developer and local IPs
          ignoreip = 127.0.0.1/8 ::1 {{ dev_ips | replace(',', ' ') }}
          
          # Ban time: 24 hours (86400 seconds)
          bantime  = 86400
          
          # Time window: 1 hour (3600 seconds) to look for retries
          findtime  = 3600
          
          # Maximum retries before banning
          maxretry = 3

          [sshd]
          enabled = true
      notify: Restart Fail2Ban

    # Clone the application source code from GitLab using the dynamic branch
    - name: Clone the repository from GitLab
      git:
        repo: 'https://gitlab.com/lakicsdomi-portfolio/telemetry-api.git'
        dest: /home/ubuntu/app
        version: "{{ git_branch | default('main') }}"
        force: yes
      become: false

    # Generate the .env file with the SMTP password, dynamic IPs, and the specific Docker Image tag from GitLab CI
    - name: Create .env file with secrets
      copy:
        dest: /home/ubuntu/app/.env
        content: |
          SMTP_PASSWORD={{ smtp_pass }}
          AllowedIps={{ dev_ips | replace(' ', ',') }}
          API_IMAGE={{ api_image }}
          DOMAIN_NAME={{ domain_name }}
      become: false

    # Authenticate with GitLab Container Registry to pull the private image
    - name: Log in to GitLab Container Registry
      shell: "docker login -u {{ registry_user }} -p {{ registry_password }} {{ registry }}"

    # Pull the latest Docker images specified in the compose file
    - name: Pull the latest Docker images
      shell: "docker compose pull"
      args:
        chdir: /home/ubuntu/app

    - name: Install Certbot
      become: yes
      apt:
        name: certbot
        state: present

    - name: Obtain SSL certificate from Let's Encrypt
      become: yes
      command: >
        certbot certonly --standalone 
        --non-interactive --agree-tos 
        --email lakicsdomi@gmail.com 
        -d {{ domain_name }}
      args:
        creates: /etc/letsencrypt/live/{{ domain_name }}/fullchain.pem

    # Run Docker Compose to start the application
    - name: Start the Docker Compose stack
      shell: "docker compose up -d"
      args:
        chdir: /home/ubuntu/app

    # Set permissions for security scripts to ensure they are executable
    - name: Set executable permission on security scripts
      file:
        path: "/home/ubuntu/app/scripts/{{ item }}"
        mode: '0755'
      loop:
        - check_security.sh
        - check_security.py
      ignore_errors: "{{ ansible_check_mode }}"

    # Schedule the security audit and auto-ban script every hour
    - name: Schedule security auto-ban script every hour
      ansible.builtin.cron:
        name: "Run SSH security auto-ban"
        minute: "0" # Minden óra elején lefut
        job: "/bin/bash /home/ubuntu/app/scripts/check_security.sh >> /home/ubuntu/security_audit.log 2>&1"
      become: yes

  # Handlers are only executed if notified by a task that changed the system state
  handlers:
    - name: Restart Fail2Ban
      service:
        name: fail2ban
        state: restarted
      # Avoid dry-run errors by only restarting if we're not in check mode
      when: not ansible_check_mode