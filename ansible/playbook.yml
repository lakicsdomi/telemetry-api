---
- name: Setup Telemetry Stack on AWS
  hosts: telemetry_server
  become: yes

  tasks:
    # System Cleanup: Fix broken packages and remove any Docker-related conflicts
    # This ensures a stable base before installing our specific Docker version.
    - name: Force cleanup of broken dpkg and purge Docker remnants
      shell: |
        dpkg --configure -a || true
        apt-get --fix-broken install -y || true
        rm -f /etc/apt/sources.list.d/*docker*.list || true
        apt-get purge -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin docker-ce-rootless-extras docker.io docker-compose docker-compose-v2 containerd runc || true
        apt-get autoremove -y || true
      ignore_errors: yes

    # Package Installation: Install Docker, Git, Fail2Ban and Certbot
    # Using standard Ubuntu repositories for maximum stability on t3.micro.
    - name: Update apt cache and install core dependencies
      apt:
        name:
          - docker.io
          - docker-compose-v2
          - git
          - fail2ban
          - certbot
        state: present
        update_cache: yes

    # Memory Optimization: Ensure 2GB Swap file exists
    # Critical for t3.micro (1GB RAM) to prevent OOM (Out Of Memory) kills during high load.
    - name: Ensure 2GB Swap file exists
      shell: |
        if [ ! -f /swapfile ]; then
          fallocate -l 2G /swapfile
          chmod 600 /swapfile
          mkswap /swapfile
          swapon /swapfile
          echo '/swapfile none swap sw 0 0' >> /etc/fstab
        fi
      args:
        creates: /swapfile

    # Security: Configure Fail2Ban with Developer IP whitelisting
    # bantime is set to 24h to aggressively block brute-force attempts.
    - name: Configure Fail2Ban jail.local
      copy:
        dest: /etc/fail2ban/jail.local
        content: |
          [DEFAULT]
          ignoreip = 127.0.0.1/8 ::1 {{ dev_ips | replace(',', ' ') }}
          bantime  = 86400
          findtime  = 3600
          maxretry = 3

          [sshd]
          enabled = true
      notify: Restart Fail2Ban

    # Application Deployment: Clone source and setup environment
    - name: Clone the repository from GitLab
      git:
        repo: 'https://gitlab.com/lakicsdomi-portfolio/telemetry-api.git'
        dest: /home/ubuntu/app
        version: "{{ git_branch | default('main') }}"
        force: yes
      become: false

    - name: Create .env file for Docker Compose
      copy:
        dest: /home/ubuntu/app/.env
        content: |
          SMTP_PASSWORD={{ smtp_pass }}
          AllowedIps={{ dev_ips | replace(' ', ',') }}
          API_IMAGE={{ api_image }}
          DOMAIN_NAME={{ domain_name }}
      become: false

    # Docker Operations: Registry login, Pull and Start containers
    - name: Log in to GitLab Container Registry
      shell: "docker login -u {{ registry_user }} -p {{ registry_password }} {{ registry }}"

    - name: Pull latest images and start stack
      shell: |
        docker compose pull
        docker compose up -d
      args:
        chdir: /home/ubuntu/app

    # SSL Management: Obtain Let's Encrypt certificate
    - name: Obtain SSL certificate via Certbot
      command: >
        certbot certonly --standalone 
        --non-interactive --agree-tos 
        --email lakicsdomi@gmail.com 
        -d {{ domain_name }}
      args:
        creates: /etc/letsencrypt/live/{{ domain_name }}/fullchain.pem

    # Maintenance & Hardening: Permissions, Cron, and SSH Security
    - name: Set executable permissions on scripts
      file:
        path: "/home/ubuntu/app/scripts/{{ item }}"
        mode: '0755'
      loop:
        - check_security.sh
        - check_security.py
      ignore_errors: "{{ ansible_check_mode }}"

    - name: Schedule security auto-ban cron job
      ansible.builtin.cron:
        name: "Run SSH security auto-ban"
        minute: "0"
        job: "/bin/bash /home/ubuntu/app/scripts/check_security.sh >> /home/ubuntu/security_audit.log 2>&1"

    # SSH Hardening: Disable password login but keep PAM enabled for session management.
    # This prevents brute-force while ensuring system stability.
    - name: Hardening SSH configuration
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        state: present
      loop:
        - { regexp: '^#?PasswordAuthentication', line: 'PasswordAuthentication no' }
        - { regexp: '^#?PubkeyAuthentication', line: 'PubkeyAuthentication yes' }
        - { regexp: '^#?UsePAM', line: 'UsePAM yes' }
        - { regexp: '^#?PermitRootLogin', line: 'PermitRootLogin prohibit-password' }
      notify: Restart SSH

  handlers:
    - name: Restart SSH
      service:
        name: ssh
        state: restarted

    - name: Restart Fail2Ban
      service:
        name: fail2ban
        state: restarted
      when: not ansible_check_mode