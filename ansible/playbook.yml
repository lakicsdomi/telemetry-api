---
- name: Setup Telemetry Stack on AWS
  hosts: telemetry_server
  become: yes

  tasks:
    # Fix dpkg and forcefully purge any conflicting Docker remnants.
    - name: Force cleanup of broken dpkg and purge Docker remnants
      shell: |
        dpkg --configure -a || true
        apt-get --fix-broken install -y || true
        rm -f /etc/apt/sources.list.d/*docker*.list || true
        apt-get purge -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin docker-ce-rootless-extras docker.io docker-compose docker-compose-v2 containerd runc || true
        apt-get autoremove -y || true
      ignore_errors: yes

    # Now that the system is completely clean, install the OS-provided Docker packages
    - name: Update apt cache and install Docker
      apt:
        name:
          - docker.io
          - docker-compose-v2
          - git
        state: present
        update_cache: yes

    # Clone the application source code from GitLab
    - name: Clone the repository from GitLab
      git:
        repo: 'https://gitlab.com/lakicsdomi-portfolio/telemetry-api.git'
        dest: /home/ubuntu/app
        version: main
        force: yes
      become: false

    # Generate the .env file with the SMTP password
    - name: Create .env file with secrets
      copy:
        dest: /home/ubuntu/app/.env
        content: "SMTP_PASSWORD={{ smtp_pass }}"
      become: false

    # Run Docker Compose to build and start the application
    - name: Start the Docker Compose stack
      shell: "docker compose up -d"
      args:
        chdir: /home/ubuntu/app