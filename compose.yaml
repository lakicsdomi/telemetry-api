# Comments are provided throughout this file to help you get started.
# If you need more help, visit the Docker Compose reference guide at
# https://docs.docker.com/go/compose-spec-reference/

# Here the instructions define your application as a service called "server".
# This service is built from the Dockerfile in the current directory.
# You can add other services your application may depend on here, such as a
# database or a cache. For examples, see the Awesome Compose repository:
# https://github.com/docker/awesome-compose
services:
  server:
    image: ${API_IMAGE}
    ports:
      - 8080:8080
    env_file:
      - .env
    environment:
      - ASPNETCORE_URLS=http://+:8080;http://+:9091 # Expose both the main API port and the metrics port for Prometheus scraping 
    # Configure Docker log retention to avoid disk space issues
    logging:
      driver: "json-file" # Use the default JSON file logging driver
      options:
        max-size: "10m" # Rotate log files when they reach 10 megabytes
        max-file: "3"   # Keep a maximum of 3 log files
    develop:
      watch:
        - action: rebuild
          path: .
          ignore:
            - bin/
            - obj/

  prometheus: 
    image: prom/prometheus
    ports:
      - 9090:9090
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - server
  
  grafana:
    image: grafana/grafana
    ports:
      - 3000:3000
    volumes:
      - ./grafana/provisioning/dashboards/dashboard-config.yaml:/etc/grafana/provisioning/dashboards/dashboard-config.yaml
      - ./grafana/provisioning/datasources/ds-config.yaml:/etc/grafana/provisioning/datasources/ds-config.yaml
      # Mount the alerting provisioning folder
      - ./grafana/provisioning/alerting:/etc/grafana/provisioning/alerting
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      # SMTP configuration for email alerts
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=smtp.gmail.com:587
      - GF_SMTP_USER=lakicsdomi@gmail.com
      - GF_SMTP_PASSWORD=${SMTP_PASSWORD}
      - GF_SMTP_FROM_ADDRESS=lakicsdomi@gmail.com
    depends_on:
      - prometheus

volumes:
  grafana-data: # persists Grafana data between container restarts

