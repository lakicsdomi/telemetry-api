workflow: # Define the workflow rules to control when pipelines are created
  rules:
    # Prevent branch pipelines if an MR is open for that branch.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never 

    # Allow pipeline for MR events (test)
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    
    # Allow pipeline for the main branch (deploy)
    - if: $CI_COMMIT_BRANCH == "main" 

    # Allow pipeline for other branches without open MRs (build/test)
    - if: $CI_COMMIT_BRANCH 

# Global default settings for all jobs
default:
  # This tag variable allows switching between your PC and GitLab runners
  # without modifying the code.
  tags:
    - "${RUNNER_TAG}"

stages:
  - test
  - build
  - validate # New stage for configuration validation (dry-run)
  - deploy

# Include the dependency scanning template
include:
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml

cache:
  key: ${CI_COMMIT_REF_SLUG} # per branch to avoid conflicts
  paths:
    - .nuget/packages/ # Cache NuGet packages to speed up restores
  policy: pull-push
  fallback_keys:
    - main # Fallback to main branch cache if the current branch cache is not available
    - default # Fallback to default cache if main branch cache is also not available

# Global variables
variables:
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
  # Use this variable in GitLab UI (Settings -> CI/CD -> Variables) 
  # to set "my-pc-runner" or leave it empty for Shared Runners.
  RUNNER_TAG: "" 
  NUGET_PACKAGES_DIRECTORY: ".nuget/packages"

# Test stage with Coverage and JUnit reports
test:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:9.0-alpine
  script:
    - echo "Running unit tests with cache..."
    - dotnet restore ./TelemetryApi.sln --packages $NUGET_PACKAGES_DIRECTORY
    - mkdir -p ./junit 
    - >
      dotnet test ./TelemetryApi.Tests/TelemetryApi.Tests.csproj -c Release 
      --logger:"junit;LogFilePath=$CI_PROJECT_DIR/junit/test-result.xml" 
      --collect:"XPlat Code Coverage" 
    - apk add --no-cache grep 
    - |
      COVERAGE_FILE=$(find . -name "coverage.cobertura.xml" | head -1) 
      if [ -f "$COVERAGE_FILE" ]; then 
        COVERAGE=$(grep -oP 'line-rate="\K[^"]+' "$COVERAGE_FILE" | awk '{print $1*100}')
        echo "TOTAL_COVERAGE=$COVERAGE" 
      else
        echo "TOTAL_COVERAGE=0" 
      fi
  artifacts:
    when: always
    paths:
      - ./junit/test-result.xml
      - "**/TestResults/**/*.xml"
    reports:
      junit: ./junit/test-result.xml
      coverage_report:
        coverage_format: cobertura
        path: "**/TestResults/**/*.xml"
  coverage: '/TOTAL_COVERAGE=(\d+(?:\.\d+)?)/'

# Build job template to keep it DRY
.build_base:
  stage: build
  image: docker:latest
  before_script:
    - echo "Logging into GitLab Container Registry..."
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - echo "Building the Docker image..."
    - docker build --pull -t $IMAGE_TAG . # Use --pull to ensure we get the latest base images for security updates
    - echo "Pushing the image to the registry..."
    - docker push $IMAGE_TAG

# Run on self hosted runner ("my-pc-runner") - No Docker-in-Docker needed
build_on_pc:
  extends: .build_base
  rules:
    - if: $RUNNER_TAG != ""  # Runs if the variable is set (your PC)

# Run on GitLab's shared runners - Use Docker-in-Docker for building
build_on_shared:
  extends: .build_base
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    - if: $RUNNER_TAG == "" # Runs if the variable is empty (GitLab)

# Ansible syntax check
ansible_syntax_check:
  stage: validate
  image: alpine:3.19
  script:
    - apk add --no-cache ansible
    - cd ansible
    - ansible-playbook playbook.yml --syntax-check
  rules:
    - if: $CI_COMMIT_BRANCH != "main"

# Base template for deployment
.deploy_template:
  stage: deploy
  image: alpine:3.19
  before_script:
    - echo "Installing Ansible and SSH client..."
    - apk add --no-cache ansible openssh-client
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - |
      if [ -n "$DEPLOY_PRIVATE_KEY" ]; then
        echo "$DEPLOY_PRIVATE_KEY" | base64 -d > ~/.ssh/telemetry_key
        chmod 600 ~/.ssh/telemetry_key
      fi
    - |
      cat > ~/.ssh/config <<EOF
      Host *
        StrictHostKeyChecking no
        UserKnownHostsFile=/dev/null
        IdentityFile ~/.ssh/telemetry_key
        IdentitiesOnly yes
      EOF
    - chmod 644 ~/.ssh/config
    - cd ansible
    - echo "[telemetry_server]" > inventory.ini
    - echo "$SERVER_IP" >> inventory.ini
    - export ANSIBLE_HOST_KEY_CHECKING=False

# Dry-Run deployment
deploy_dry_run:
  extends: .deploy_template
  script:
    - echo "Executing DRY-RUN deployment playbook..."
    - >
      ansible-playbook -i inventory.ini playbook.yml 
      -u ubuntu 
      -c ssh 
      --check 
      -e "smtp_pass=$SMTP_PASSWORD" 
      -e "dev_ips='$DEVELOPER_IPS'" 
      -e "api_image=$IMAGE_TAG" 
      -e "registry_user=$CI_REGISTRY_USER" 
      -e "registry_password=$CI_REGISTRY_PASSWORD" 
      -e "registry=$CI_REGISTRY" 
      -e "git_branch=$CI_COMMIT_REF_NAME" 
      -e "domain_name=$DOMAIN_NAME"
  rules:
    - if: '$CI_COMMIT_BRANCH != "main"'
      when: manual
  allow_failure: true 

# Main branch dry run check
deploy_check_on_main:
  extends: .deploy_template
  script:
    - echo "Verifying deployment possibility on main server..."
    - >
      ansible-playbook -i inventory.ini playbook.yml 
      -u ubuntu 
      -c ssh 
      --check 
      -e "smtp_pass=$SMTP_PASSWORD" 
      -e "dev_ips='$DEVELOPER_IPS'" 
      -e "api_image=$IMAGE_TAG" 
      -e "registry_user=$CI_REGISTRY_USER" 
      -e "registry_password=$CI_REGISTRY_PASSWORD" 
      -e "registry=$CI_REGISTRY" 
      -e "git_branch=$CI_COMMIT_REF_NAME" 
      -e "domain_name=$DOMAIN_NAME"
  only:
    - main

# Actual configuration Management and Deployment to AWS
deploy_to_aws:
  extends: .deploy_template
  script:
    - echo "Executing deployment playbook..."
    - >
      ansible-playbook -i inventory.ini playbook.yml 
      -u ubuntu 
      -c ssh 
      -e "smtp_pass=$SMTP_PASSWORD" 
      -e "dev_ips='$DEVELOPER_IPS'" 
      -e "api_image=$IMAGE_TAG" 
      -e "registry_user=$CI_REGISTRY_USER" 
      -e "registry_password=$CI_REGISTRY_PASSWORD" 
      -e "registry=$CI_REGISTRY" 
      -e "git_branch=$CI_COMMIT_REF_NAME" 
      -e "domain_name=$DOMAIN_NAME"
  needs: ["deploy_check_on_main"] 
  rules:
    - if: $CI_COMMIT_BRANCH == "main" # Only deploy to AWS when changes are merged into main
      changes:
      - "ansible/**/*"          # Ansible playbooks and roles for deployment and configuration management
      - "scripts/**/*"          # Scripts for security, monitoring, and maintenance tasks
      - "TelemetryApi/**/*"     # Application code changes
      - "terraform/**/*"        # Terraform infrastructure changes (new resources, configuration changes)
      - "grafana/**/*"          # Grafana provisioning and dashboard changes
      - "prometheus.yml"        # Prometheus scrape config changes (new targets, interval changes)
      - "compose.yaml"          # Docker stack config changes (new services, network changes, volume changes)
      - "nginx.conf"            # Reverse proxy and SSL configuration changes
      - ".gitlab-ci.yml"        # Pipeline logic changes
      - "Dockerfile"            # Container build changes, app environment changes
      

# Documentation stage (Doxygen)
pages:
  stage: deploy
  image: alpine:latest
  cache:
    key: ${CI_COMMIT_REF_SLUG}-doxygen
    paths:
      - public/
    policy: pull-push
  before_script:
    - apk add --no-cache doxygen graphviz
  script:
    - mkdir -p public
    - |
      if [ ! -f Doxyfile ]; then
          doxygen -g Doxyfile
          sed -i 's/^PROJECT_NAME.*/PROJECT_NAME = "Telemetry API"/' Doxyfile
          sed -i 's|^INPUT .*|INPUT = README.md TelemetryApi/ TelemetryApi.Tests/|' Doxyfile
          sed -i 's|^USE_MDFILE_AS_MAINPAGE .*|USE_MDFILE_AS_MAINPAGE = README.md|' Doxyfile
          sed -i 's|^EXCLUDE .*|EXCLUDE = README.Docker.md TelemetryApi/obj/ TelemetryApi/bin/|' Doxyfile
          sed -i 's/^RECURSIVE.*/RECURSIVE = YES/' Doxyfile
          sed -i 's/^GENERATE_HTML.*/GENERATE_HTML = YES/' Doxyfile
          sed -i 's|^HTML_OUTPUT .*|HTML_OUTPUT = public|' Doxyfile
      fi
    - doxygen Doxyfile
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - "TelemetryApi/**/*"
        - "README.md"
        - ".gitlab-ci.yml"