workflow: # Define the workflow rules to control when pipelines are created
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never # Prevent duplicate pipelines for branches with open merge requests
    - if: $CI_COMMIT_BRANCH == "main" 
    - if: $CI_COMMIT_BRANCH 

# The above rules ensure that pipelines are only created for merge request events, the main branch,
# and any other branches that do not have open merge requests, thus avoiding redundant pipelines 
# and optimizing CI/CD resource usage.

stages:
  - test
  - build
  - validate # New stage for configuration validation (dry-run)
  - deploy

# Include the dependency scanning template provided by GitLab to automatically scan for vulnerabilities in project dependencies
include:
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml
  
# Run tests in the built-in GitLab Container Registry
variables:
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG

# Test stage with Coverage and JUnit reports
test:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:9.0-alpine
  script:
    - echo "Running unit tests..."
    - dotnet restore ./TelemetryApi.sln  # Restore NuGet packages for solution
    - mkdir -p ./junit  # Create directory for JUnit test results
    - >
      dotnet test ./TelemetryApi.Tests/TelemetryApi.Tests.csproj -c Release 
      --logger:"junit;LogFilePath=$CI_PROJECT_DIR/junit/test-result.xml" 
      --collect:"XPlat Code Coverage" # Run tests and collect code coverage, outputting results in JUnit format for GitLab CI
    - apk add --no-cache grep # Install grep to extract coverage information from the Cobertura XML report
    - |
      COVERAGE_FILE=$(find . -name "coverage.cobertura.xml" | head -1) # Find the Cobertura XML report generated by the test run
      if [ -f "$COVERAGE_FILE" ]; then # Check if the coverage file exists
        COVERAGE=$(grep -oP 'line-rate="\K[^"]+' "$COVERAGE_FILE" | awk '{print $1*100}')
        echo "TOTAL_COVERAGE=$COVERAGE" # Extract the line coverage percentage from the Cobertura XML report and set it as a variable for GitLab CI to use in the coverage report
      else
        echo "TOTAL_COVERAGE=0" # If the coverage file is not found, set coverage to 0 to avoid errors in GitLab CI
      fi
  artifacts:
    when: always
    paths:
      - ./junit/test-result.xml
      - "**/TestResults/**/*.xml"
    reports:
      junit: ./junit/test-result.xml
      coverage_report:
        coverage_format: cobertura
        path: "**/TestResults/**/*.xml"
  coverage: '/TOTAL_COVERAGE=(\d+(?:\.\d+)?)/'

# Build the Docker image and push it to the registry
build_and_push_image:
  image: docker:24.0.5  # Use the Docker CLI image to build and push the image
  stage: build  
  services:
    - docker:24.0.5-dind  # Use Docker-in-Docker to allow building and pushing images
  variables:
    DOCKER_TLS_CERTDIR: "/certs"  # Set the TLS cert directory for secure communication with the Docker daemon
  before_script:
    - echo "Logging into GitLab Container Registry..."
    # Authenticate with the built-in registry using GitLab's automatic tokens
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY  # Log in to the registry using GitLab CI/CD variables for authentication
  script:
    - echo "Building the Docker image..."
    - docker build -t $IMAGE_TAG .  # Build the Docker image using the Dockerfile in the current directory and tag it with the appropriate registry path
    - echo "Pushing the image to the registry..."
    - docker push $IMAGE_TAG  # Push the built image to the GitLab Container Registry using the tag defined in the variables section

# Ansible syntax check to validate the playbook structure and variable references w.o. executing any tasks,
# ensuring that the configuration is correct before attempting a deployment.
ansible_syntax_check:
  stage: validate
  image: alpine:3.19
  script:
    - apk add --no-cache ansible
    - cd ansible
    # Checks if the YAML structure and the variable references are correct.
    - ansible-playbook playbook.yml --syntax-check
  rules:
    - if: $CI_COMMIT_BRANCH != "main"

# Base template for deployment to avoid code repetition (DRY)
.deploy_template:
  stage: deploy
  # lightweight alpine image for faster execution of Ansible playbooks
  image: alpine:3.19
  before_script:
    - echo "Installing Ansible and SSH client..."
    - apk add --no-cache ansible openssh-client
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    # Decode the Base64 variable into a clean key file if it exists
    - |
      if [ -n "$DEPLOY_PRIVATE_KEY" ]; then
        echo "$DEPLOY_PRIVATE_KEY" | base64 -d > ~/.ssh/telemetry_key
        chmod 600 ~/.ssh/telemetry_key
      fi
    # Configure SSH to be quiet, accept new hosts automatically, and use our specific key
    - |
      cat > ~/.ssh/config <<EOF
      Host *
        StrictHostKeyChecking no
        UserKnownHostsFile=/dev/null
        IdentityFile ~/.ssh/telemetry_key
        IdentitiesOnly yes
      EOF
    - chmod 644 ~/.ssh/config
    # Prepare ansible execution
    - cd ansible
    # Robust inventory generation: Overwrite file with current SERVER_IP from GitLab variables
    - echo "[telemetry_server]" > inventory.ini
    - echo "$SERVER_IP" >> inventory.ini
    - export ANSIBLE_HOST_KEY_CHECKING=False

# Dry-Run deployment (Manual trigger on feature branches)
deploy_dry_run:
  extends: .deploy_template
  script:
    - echo "Executing DRY-RUN deployment playbook..."
    # The --check flag ensures no actual changes are made to the server
    - ansible-playbook -i inventory.ini playbook.yml -u ubuntu -e "smtp_pass=$SMTP_PASSWORD" -e "dev_ips='$DEVELOPER_IPS'" -e "api_image=$IMAGE_TAG" -e "registry_user=$CI_REGISTRY_USER" -e "registry_password=$CI_REGISTRY_PASSWORD" -e "registry=$CI_REGISTRY" -e "git_branch=$CI_COMMIT_REF_NAME" -c ssh --check
  rules:
    - if: '$CI_COMMIT_BRANCH != "main"'
      when: manual
  allow_failure: true # Allow failures in dry-run to not block the pipeline, as it's meant for testing configuration validity on feature branches

# Main branch dry run check before actual deployment (Auto on main)
deploy_check_on_main:
  extends: .deploy_template
  script:
    - echo "Verifying deployment possibility on main server..."
    - ansible-playbook -i inventory.ini playbook.yml -u ubuntu -e "smtp_pass=$SMTP_PASSWORD" -e "dev_ips='$DEVELOPER_IPS'" -e "api_image=$IMAGE_TAG" -e "registry_user=$CI_REGISTRY_USER" -e "registry_password=$CI_REGISTRY_PASSWORD" -e "registry=$CI_REGISTRY" -e "git_branch=$CI_COMMIT_REF_NAME" -c ssh --check
  only:
    - main
  # this ensures, that if there are any issues, the next deploy_to_aws job will not run

# Actual configuration Management and Deployment to AWS (Auto on main)
deploy_to_aws:
  extends: .deploy_template
  script:
    - echo "Executing deployment playbook..."
    - ansible-playbook -i inventory.ini playbook.yml -u ubuntu -e "smtp_pass=$SMTP_PASSWORD" -e "dev_ips='$DEVELOPER_IPS'" -e "api_image=$IMAGE_TAG" -e "registry_user=$CI_REGISTRY_USER" -e "registry_password=$CI_REGISTRY_PASSWORD" -e "registry=$CI_REGISTRY" -e "git_branch=$CI_COMMIT_REF_NAME" -c ssh
  only:
    - main
  needs: ["deploy_check_on_main"] # Ensure that the deployment only proceeds if the dry-run check on main was successful

# Documentation stage (Doxygen) -> Deploys to GitLab Pages
pages:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache doxygen graphviz
  script:
    - mkdir -p public
    # Generate Doxyfile
    - doxygen -g Doxyfile
    # Configuration tuning:
    - sed -i 's/^PROJECT_NAME.*/PROJECT_NAME = "Telemetry API"/' Doxyfile
    # Specify the input files and directories 
    - sed -i 's|^INPUT .*|INPUT = README.md TelemetryApi/ TelemetryApi.Tests/|' Doxyfile
    # Set the README.md as the main page of the documentation
    - sed -i 's|^USE_MDFILE_AS_MAINPAGE .*|USE_MDFILE_AS_MAINPAGE = README.md|' Doxyfile
    # Ignore the generated files and the README.Docker.md from the documentation
    - sed -i 's|^EXCLUDE .*|EXCLUDE = README.Docker.md TelemetryApi/obj/ TelemetryApi/bin/|' Doxyfile
    - sed -i 's/^RECURSIVE.*/RECURSIVE = YES/' Doxyfile
    - sed -i 's/^GENERATE_HTML.*/GENERATE_HTML = YES/' Doxyfile
    - sed -i 's|^HTML_OUTPUT .*|HTML_OUTPUT = public|' Doxyfile
    - doxygen Doxyfile
  artifacts:
    paths:
      - public
  only:
    - main