# HTTP Server (Incoming traffic on port 80)
server {
    listen 80;
    server_name ${DOMAIN_NAME};

    # Allow Let's Encrypt Certbot to verify the domain ownership
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to secure HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server (Secure connection on port 443)
server {
    listen 443 ssl;
    server_name ${DOMAIN_NAME};

    # Paths to the Let's Encrypt certificates mapped from the host machine
    ssl_certificate /etc/letsencrypt/live/${DOMAIN_NAME}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN_NAME}/privkey.pem;

    # Forward secure traffic to the backend server
    location / {
        proxy_pass         http://server:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection keep-alive;
        proxy_set_header   Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Forward real client IP to the backend
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}